name: 每日MACD金叉名单

on:
  schedule:
    - cron: '5 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compute MACD golden/death cross list
        run: python3 build_macd.py
      - name: Commit result if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add macd-cross.json etf-boards.json
          if git diff --cached --quiet; then
            echo 'cross list unchanged, skip commit'
          else
            git commit -m '每日MACD金叉名单更新'
            git push
          fi
