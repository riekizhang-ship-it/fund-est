<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ETF标的榜单 · MACD金叉/死叉</title>
<style>
  :root { --up:#d43a2f; --down:#1a9e57; --ink:#1c1e21; --sub:#8a8f98; --line:#ececf0; --bg:#f6f6f8; --card:#fff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:1240px; margin:0 auto; padding:14px 12px 40px; }
  header { padding:6px 2px 4px; }
  h1 { font-size:20px; margin:0 0 4px; display:inline-block; }
  .badge { display:inline-block; vertical-align:2px; margin-left:8px; font-size:11px; padding:2px 8px; border-radius:99px; background:#e8f6ee; color:var(--down); }
  .badge.load { background:#eef1f5; color:var(--sub); }
  .nav { font-size:13px; margin-top:6px; }
  .nav a { color:#2f6fd0; text-decoration:none; margin-right:14px; }
  .sub { color:var(--sub); font-size:12.5px; margin-top:6px; }
  .switch { display:flex; gap:10px; margin-top:12px; }
  .switch button { flex:1; border:1px solid var(--line); background:#fff; border-radius:12px; padding:12px 0; font-size:16px; font-weight:600; color:var(--ink); }
  .switch button.on-g { background:var(--up); border-color:var(--up); color:#fff; }
  .switch button.on-d { background:var(--down); border-color:var(--down); color:#fff; }
  .card { background:var(--card); border-radius:14px; padding:12px; margin-top:12px; box-shadow:0 1px 3px rgba(20,20,40,.05); }
  .bhead { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .bhead h2 { font-size:16.5px; margin:2px 0; }
  .sortseg { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--sub); }
  .sortseg button { border:1px solid var(--line); background:#fff; border-radius:99px; padding:5px 13px; font-size:12.5px; color:var(--ink); }
  .sortseg button.on { background:#1c1e21; color:#fff; border-color:#1c1e21; }
  .tip { font-size:12px; color:var(--sub); margin:4px 0 2px; }
  .cols { display:grid; grid-template-columns:repeat(auto-fit, minmax(290px, 1fr)); gap:14px; margin-top:4px; }
  .colh { font-size:15px; font-weight:600; padding:4px 2px 2px; }
  .colh small { color:var(--sub); font-weight:400; font-size:12px; margin-left:6px; }
  .colh .prov { color:#b97d1e; font-weight:400; font-size:11.5px; margin-left:6px; }
  .prow { padding:9px 2px; border-top:1px solid var(--line); cursor:pointer; }
  .prow .nm { font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prow .meta { color:var(--sub); font-size:11.5px; margin-top:2px; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stat { text-align:center; color:var(--sub); font-size:12px; padding:12px 0 6px; }
  .more { display:block; width:100%; margin-top:6px; border:1px solid var(--line); background:#fff; border-radius:10px; padding:9px; font-size:13.5px; color:var(--ink); }
  .foot { color:var(--sub); font-size:12px; line-height:1.7; margin-top:14px; padding:0 4px; }
  .up { color:var(--up); } .down { color:var(--down); }
  /* ---------- 详情页 ---------- */
  #detail { display:none; position:fixed; inset:0; background:var(--bg); z-index:60; overflow-y:auto; }
  #detail .dwrap { max-width:860px; margin:0 auto; padding:12px 12px 40px; }
  #detail .dhead { display:flex; justify-content:space-between; align-items:flex-start; }
  #dTitle { font-size:19px; font-weight:600; }
  #dTitle small { color:var(--sub); font-size:13px; font-weight:400; margin-left:8px; }
  #dClose { border:1px solid var(--line); background:#fff; border-radius:99px; padding:6px 16px; font-size:13.5px; color:var(--ink); flex:none; }
  #dQuote { color:var(--sub); font-size:13px; margin-top:6px; font-variant-numeric:tabular-nums; }
  #dQuote b { color:var(--ink); font-weight:600; }
  .seg { display:flex; gap:6px; margin:10px 0 2px; max-width:340px; }
  .seg button { flex:1; border:1px solid var(--line); background:#fff; border-radius:99px; padding:5px 0; font-size:12.5px; color:var(--ink); }
  .seg button.on { background:#1c1e21; color:#fff; border-color:#1c1e21; }
  .dcard { background:#fff; border-radius:14px; padding:12px; margin-top:12px; box-shadow:0 1px 3px rgba(20,20,40,.05); }
  .cap { font-size:13px; color:var(--ink); font-variant-numeric:tabular-nums; line-height:1.55; }
  .cap .lb { display:inline-block; background:#eef1f5; border-radius:6px; padding:1px 8px; font-size:12.5px; margin-right:8px; }
  .chartbox { border:1px solid var(--line); border-radius:8px; margin-top:6px; overflow:hidden; }
  .chartbox svg { width:100%; display:block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ETF标的榜单</h1><span class="badge load" id="dateBadge">加载中…</span>
    <div class="nav"><a href="./index.html">指数基金实时估算榜</a><a href="./rank.html">全市场涨跌榜+自选</a><a href="./etf.html">ETF实时榜·资金流</a></div>
    <div class="sub" id="subInfo">正在加载名单…</div>
  </header>

  <div class="switch">
    <button id="swGold" class="on-g">MACD 金叉</button>
    <button id="swDead">MACD 死叉</button>
  </div>

  <section class="card">
    <div class="bhead">
      <h2 id="boardTitle">MACD 金叉</h2>
      <div class="sortseg"><span id="sortLabel">距金叉点</span>
        <button id="sortNear" class="on">近 → 远</button>
        <button id="sortFar">远 → 近</button>
      </div>
    </div>
    <div class="tip" id="boardTip">点任意一只看它的图（K线 + MACD + KDJ）。</div>
    <div class="cols" id="boardCols"><div class="stat">加载中…</div></div>
  </section>

  <div class="foot">只含全市场 ETF。金叉、死叉分开两个页面，用上方按钮切换；每页里日K、周K、月K 三列并列，可按距交叉点近→远 / 远→近自己切换排序。周K/月K 按最近一根 K 线计算，本周/本月没走完，标了「未定格」，周五/月末收盘才定格。名单每个工作日收盘后自动更新；量、额与图形为打开时拉取的最新数据。仅列技术形态，不构成买卖建议。</div>
</div>

<div id="detail">
  <div class="dwrap">
    <div class="dhead">
      <div id="dTitle"></div>
      <button id="dClose">返回</button>
    </div>
    <div id="dQuote"></div>
    <div class="seg" id="dSeg">
      <button data-p="day" class="on">日K</button>
      <button data-p="week">周K</button>
      <button data-p="month">月K</button>
    </div>
    <div class="dcard" id="dBody"><div class="stat">加载中…</div></div>
  </div>
</div>

<script>
var $ = function(id) { return document.getElementById(id); };
function esc(s) { return String(s).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(v, d) { return (v === null || v === undefined || isNaN(v)) ? '—' : Number(v).toFixed(d); }
function fv(v) { return Math.abs(v) >= 100 ? fmt(v, 2) : fmt(v, 3); }
function cls(v) { return (v === null || v === undefined || isNaN(v)) ? '' : (v > 0 ? 'up' : (v < 0 ? 'down' : '')); }

/* ---------- 数据与状态 ---------- */
var DATA = null, QUOTES = {};
var curMode = 'golden';
var sortDir = { golden: 'near', death: 'near' };
var PAGE = 40;
var shownMap = { golden: { day: PAGE, week: PAGE, month: PAGE }, death: { day: PAGE, week: PAGE, month: PAGE } };
var chartCache = {};
var KLT = { day: 101, week: 102, month: 103 };
var BEG = { day: 500, week: 1700, month: 3300 };
var THS_P = { day: '01', week: '11', month: '21' };
var THS_N = { day: 500, week: 300, month: 200 };
var P_LABEL = { day: '日K', week: '周K', month: '月K' };

function marginOf(mode, e) { return mode === 'golden' ? (e.dif - e.dea) : (e.dea - e.dif); }
function boardRows(mode, p) {
  if (!DATA) return [];
  var per = DATA.periods || {};
  var rows;
  if (mode === 'golden') rows = p === 'day' ? (DATA.golden || []) : ((per[p] || {}).macd_golden || []);
  else rows = p === 'day' ? (DATA.death || []) : ((per[p] || {}).macd_death || []);
  rows = rows.filter(function(e) { return e.kind === 'ETF'; });
  var dir = sortDir[mode];
  rows.sort(function(a, b) {
    var d = marginOf(mode, a) - marginOf(mode, b);
    return dir === 'near' ? d : -d;
  });
  return rows;
}
function volHtml(secid) {
  var q = QUOTES[secid];
  if (!q) return '量 — · 额 —';
  return '量 ' + fmtVol(q.vol) + ' · 额 ' + fmtAmt(q.amt);
}
function renderBoard() {
  $('boardTitle').textContent = curMode === 'golden' ? 'MACD 金叉' : 'MACD 死叉';
  $('sortLabel').textContent = curMode === 'golden' ? '距金叉点' : '距死叉点';
  $('sortNear').classList.toggle('on', sortDir[curMode] === 'near');
  $('sortFar').classList.toggle('on', sortDir[curMode] === 'far');
  $('boardTip').textContent = (sortDir[curMode] === 'near' ? '当前按距交叉点从近到远排（刚交叉的在最前）。' : '当前按距交叉点从远到近排。') + '点任意一只看它的图（K线 + MACD + KDJ）。';
  var html = '';
  ['day', 'week', 'month'].forEach(function(p) {
    var rows = boardRows(curMode, p);
    var shown = shownMap[curMode][p];
    html += '<div class="col"><div class="colh">' + P_LABEL[p] + '<small>共 ' + rows.length + ' 只</small>' +
      (p === 'day' ? '' : '<span class="prov">未定格</span>') + '</div>';
    if (!rows.length) {
      html += '<div class="stat">暂无</div>';
    } else {
      html += rows.slice(0, shown).map(function(e, i) {
        return '<div class="prow" data-p="' + p + '" data-i="' + i + '"><div class="nm">' + esc(e.name) + '</div>' +
          '<div class="meta">' + esc(e.code) + ' · ' + volHtml(e.secid) + '</div></div>';
      }).join('');
      if (rows.length > shown) html += '<button class="more" data-p="' + p + '">显示更多（剩 ' + (rows.length - shown) + ' 只）</button>';
    }
    html += '</div>';
  });
  $('boardCols').innerHTML = html;
  Array.prototype.forEach.call($('boardCols').querySelectorAll('.prow'), function(el) {
    el.onclick = function() {
      var p = el.getAttribute('data-p');
      openDetail(boardRows(curMode, p)[Number(el.getAttribute('data-i'))], p);
    };
  });
  Array.prototype.forEach.call($('boardCols').querySelectorAll('.more'), function(el) {
    el.onclick = function() { shownMap[curMode][el.getAttribute('data-p')] += PAGE; renderBoard(); };
  });
}
function setMode(m) {
  curMode = m;
  $('swGold').classList.toggle('on-g', m === 'golden');
  $('swDead').classList.toggle('on-d', m === 'death');
  renderBoard();
}
function setSort(d) {
  sortDir[curMode] = d;
  renderBoard();
}
$('swGold').onclick = function() { setMode('golden'); };
$('swDead').onclick = function() { setMode('death'); };
$('sortNear').onclick = function() { setSort('near'); };
$('sortFar').onclick = function() { setSort('far'); };

/* ---------- 量 / 额 / 现价（批量行情） ---------- */
function fetchJSON(url, timeoutMs) {
  return new Promise(function(resolve, reject) {
    var ctl = new AbortController();
    var t = setTimeout(function() { ctl.abort(); }, timeoutMs || 12000);
    fetch(url, { signal: ctl.signal }).then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(j) { clearTimeout(t); resolve(j); }).catch(function(e) { clearTimeout(t); reject(e); });
  });
}
function fmtVol(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return fmt(v / 10000, 2) + '万手';
}
function fmtAmt(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  if (Math.abs(v) >= 1e8) return fmt(v / 1e8, 2) + '亿';
  if (Math.abs(v) >= 1e4) return fmt(v / 1e4, 1) + '万';
  return String(v);
}
async function loadQuotes() {
  var seen = {}, secids = [];
  ['golden', 'death'].forEach(function(m) {
    ['day', 'week', 'month'].forEach(function(p) {
      boardRows(m, p).forEach(function(e) { if (!seen[e.secid]) { seen[e.secid] = 1; secids.push(e.secid); } });
    });
  });
  if (!secids.length) return;
  var chunks = [];
  for (var i = 0; i < secids.length; i += 150) chunks.push(secids.slice(i, i + 150));
  for (var ci = 0; ci < chunks.length; ci++) {
    var path = '/api/qt/ulist.np/get?fltt=2&invt=2&fields=f12,f13,f2,f3,f5,f6&secids=' + chunks[ci].join(',');
    var j = null, hosts = ['push2.eastmoney.com', 'push2delay.eastmoney.com'];
    for (var hi = 0; hi < hosts.length && !j; hi++) {
      try { j = await fetchJSON('https://' + hosts[hi] + path, 12000); } catch (e) { j = null; }
    }
    var diff = (j && j.data && j.data.diff) || [];
    diff.forEach(function(x) { QUOTES[x.f13 + '.' + x.f12] = { price: x.f2, pct: x.f3, vol: x.f5, amt: x.f6 }; });
  }
  renderBoard();
  if (detailEntry) renderDetailQuote();
}

/* ---------- K 线拉取 ---------- */
function fetchTHSJsonp(code, periodCode, lastN) {
  return new Promise(function(resolve, reject) {
    var cbName = 'quotebridge_v6_line_hs_' + code + '_' + periodCode + '_last' + lastN;
    var s = document.createElement('script');
    var timer = setTimeout(function() { cleanup(); reject(new Error('ths timeout')); }, 12000);
    function cleanup() {
      clearTimeout(timer);
      try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
    }
    window[cbName] = function(j) { cleanup(); resolve(j); };
    s.onerror = function() { cleanup(); reject(new Error('ths error')); };
    s.src = 'https://d.10jqka.com.cn/v6/line/hs_' + code + '/' + periodCode + '/last' + lastN + '.js';
    document.head.appendChild(s);
  });
}
async function fetchBars(secid, code, period) {
  var beg = new Date(Date.now() - BEG[period] * 864e5);
  var begS = beg.getFullYear() + String(beg.getMonth() + 1).padStart(2, '0') + String(beg.getDate()).padStart(2, '0');
  var url = 'https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=' + secid +
    '&fields1=f1,f2&fields2=f51,f52,f53,f54,f55&klt=' + KLT[period] + '&fqt=1&beg=' + begS + '&end=20500101';
  for (var att = 0; att < 2; att++) {
    try {
      var j = await fetchJSON(url, 12000);
      var kl = (j && j.data && j.data.klines) || [];
      if (kl.length >= 40) return kl.map(function(s) { var p = s.split(','); return { d: p[0], o: +p[1], c: +p[2], h: +p[3], l: +p[4] }; });
    } catch (err) { /* 重试/转备选 */ }
    await new Promise(function(rs) { setTimeout(rs, 900); });
  }
  for (var att2 = 0; att2 < 2; att2++) {
    try {
      var tj = await fetchTHSJsonp(code, THS_P[period], THS_N[period]);
      var data = (tj && tj.data) || '';
      var bars = data.split(';').filter(Boolean).map(function(s) {
        var p = s.split(',');
        return { d: p[0].slice(0, 4) + '-' + p[0].slice(4, 6) + '-' + p[0].slice(6, 8), o: +p[1], h: +p[2], l: +p[3], c: +p[4] };
      }).filter(function(b) { return b.c > 0; });
      if (bars.length >= 40) return bars;
    } catch (err2) { /* 继续重试 */ }
    await new Promise(function(rs) { setTimeout(rs, 900); });
  }
  return null;
}

/* ---------- 指标与画图（同花顺式：细线、实心柱） ---------- */
function ema(arr, n) {
  var k = 2 / (n + 1), out = [], prev = null;
  for (var i = 0; i < arr.length; i++) { prev = prev === null ? arr[i] : arr[i] * k + prev * (1 - k); out.push(prev); }
  return out;
}
function macdCalc(closes) {
  var e12 = ema(closes, 12), e26 = ema(closes, 26);
  var dif = closes.map(function(_, i) { return e12[i] - e26[i]; });
  var dea = ema(dif, 9);
  var bar = dif.map(function(v, i) { return 2 * (v - dea[i]); });
  return { dif: dif, dea: dea, bar: bar };
}
function kdjCalc(bars) {
  var K = [], D = [], J = [], k = 50, d = 50;
  for (var i = 0; i < bars.length; i++) {
    var s = Math.max(0, i - 8), hh = -Infinity, ll = Infinity;
    for (var j = s; j <= i; j++) { hh = Math.max(hh, bars[j].h); ll = Math.min(ll, bars[j].l); }
    var rsv = hh === ll ? 50 : (bars[i].c - ll) / (hh - ll) * 100;
    k = 2 / 3 * k + 1 / 3 * rsv;
    d = 2 / 3 * d + 1 / 3 * k;
    K.push(k); D.push(d); J.push(3 * k - 2 * d);
  }
  return { K: K, D: D, J: J };
}
function chartCandles(bars, h) {
  var w = 720, pad = 6;
  var mn = Infinity, mx = -Infinity, i;
  for (i = 0; i < bars.length; i++) { mn = Math.min(mn, bars[i].l); mx = Math.max(mx, bars[i].h); }
  if (mx === mn) { mx += 1; mn -= 1; }
  var X = function(i) { return pad + (w - 2 * pad) * i / (bars.length - 1); };
  var Y = function(v) { return pad + (h - 2 * pad) * (1 - (v - mn) / (mx - mn)); };
  var bw = Math.max(1, (w - 2 * pad) / bars.length * 0.68);
  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" style="height:' + h + 'px">';
  bars.forEach(function(b, i) {
    var up = b.c >= b.o;
    var col = up ? '#d43a2f' : '#12964f';
    svg += '<line x1="' + X(i).toFixed(1) + '" y1="' + Y(b.h).toFixed(1) + '" x2="' + X(i).toFixed(1) + '" y2="' + Y(b.l).toFixed(1) + '" stroke="' + col + '" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    var yT = Y(Math.max(b.o, b.c)), yB = Y(Math.min(b.o, b.c));
    svg += '<rect x="' + (X(i) - bw / 2).toFixed(1) + '" y="' + yT.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, yB - yT).toFixed(1) + '" fill="' + (up ? '#ffffff' : col) + '" stroke="' + col + '" stroke-width="1" vector-effect="non-scaling-stroke"/>';
  });
  svg += '</svg>';
  return svg;
}
function chartMACD(dif, dea, bar, h) {
  var w = 720, pad = 6;
  var all = dif.concat(dea).concat(bar);
  var mn = Infinity, mx = -Infinity, i;
  for (i = 0; i < all.length; i++) { mn = Math.min(mn, all[i]); mx = Math.max(mx, all[i]); }
  if (mx === mn) { mx += 1; mn -= 1; }
  var X = function(i) { return pad + (w - 2 * pad) * i / (dif.length - 1); };
  var Y = function(v) { return pad + (h - 2 * pad) * (1 - (v - mn) / (mx - mn)); };
  var bw = Math.max(1, (w - 2 * pad) / dif.length * 0.62);
  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" style="height:' + h + 'px">';
  svg += '<line x1="0" y1="' + Y(0).toFixed(1) + '" x2="' + w + '" y2="' + Y(0).toFixed(1) + '" stroke="#d8d8de" stroke-width="1"/>';
  bar.forEach(function(v, i) {
    var y0 = Y(0), y1 = Y(v);
    svg += '<rect x="' + (X(i) - bw / 2).toFixed(1) + '" y="' + Math.min(y0, y1).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, Math.abs(y1 - y0)).toFixed(1) + '" fill="' + (v >= 0 ? '#e02b20' : '#12964f') + '"/>';
  });
  function line(vals, color) {
    var d = '';
    vals.forEach(function(v, i) { d += (d ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' '; });
    return '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="1.2" vector-effect="non-scaling-stroke"/>';
  }
  svg += line(dif, '#1a1a1a') + line(dea, '#2f4fd0');
  svg += '</svg>';
  return svg;
}
function chartLines(seriesList, h) {
  var w = 720, pad = 6, all = [];
  seriesList.forEach(function(s) { all = all.concat(s.vals); });
  var mn = Infinity, mx = -Infinity, i;
  for (i = 0; i < all.length; i++) { var v = all[i]; if (v === null || v === undefined) continue; mn = Math.min(mn, v); mx = Math.max(mx, v); }
  if (!isFinite(mn)) return '';
  if (mx === mn) { mx += 1; mn -= 1; }
  var X = function(i) { return pad + (w - 2 * pad) * i / (seriesList[0].vals.length - 1); };
  var Y = function(v) { return pad + (h - 2 * pad) * (1 - (v - mn) / (mx - mn)); };
  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" style="height:' + h + 'px">';
  if (mn < 0 && mx > 0) svg += '<line x1="0" y1="' + Y(0).toFixed(1) + '" x2="' + w + '" y2="' + Y(0).toFixed(1) + '" stroke="#d8d8de" stroke-width="1"/>';
  seriesList.forEach(function(s) {
    var d = '';
    s.vals.forEach(function(v, i) { if (v === null || v === undefined) return; d += (d ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' '; });
    svg += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="1.2" vector-effect="non-scaling-stroke"/>';
  });
  svg += '</svg>';
  return svg;
}

/* ---------- 详情页 ---------- */
var detailEntry = null, detailPeriod = 'day';
function openDetail(e, p) {
  detailEntry = e;
  detailPeriod = p || 'day';
  $('dTitle').innerHTML = esc(e.name) + '<small>' + esc(e.code) + '</small>';
  Array.prototype.forEach.call($('dSeg').querySelectorAll('button'), function(b) {
    b.classList.toggle('on', b.getAttribute('data-p') === detailPeriod);
  });
  $('detail').style.display = 'block';
  $('detail').scrollTop = 0;
  renderDetailQuote();
  loadDetailChart();
}
function renderDetailQuote() {
  if (!detailEntry) return;
  var q = QUOTES[detailEntry.secid];
  if (!q) { $('dQuote').textContent = '量 — · 额 —'; return; }
  $('dQuote').innerHTML = '现价 <b>' + fmt(q.price, 3) + '</b> · <span class="' + cls(q.pct) + '">' + (q.pct > 0 ? '+' : '') + fmt(q.pct, 2) + '%</span> · 量 <b>' + fmtVol(q.vol) + '</b> · 额 <b>' + fmtAmt(q.amt) + '</b>';
}
Array.prototype.forEach.call($('dSeg').querySelectorAll('button'), function(btn) {
  btn.onclick = function() {
    Array.prototype.forEach.call($('dSeg').querySelectorAll('button'), function(b) { b.classList.remove('on'); });
    btn.classList.add('on');
    detailPeriod = btn.getAttribute('data-p');
    loadDetailChart();
  };
});
$('dClose').onclick = function() { $('detail').style.display = 'none'; detailEntry = null; };
async function loadDetailChart() {
  if (!detailEntry) return;
  var e = detailEntry, p = detailPeriod;
  $('dBody').innerHTML = '<div class="stat">加载 ' + P_LABEL[p] + ' 图形中…</div>';
  var key = e.secid + '|' + p;
  var bars = chartCache[key];
  if (!bars) {
    bars = await fetchBars(e.secid, e.code, p);
    if (bars) chartCache[key] = bars;
  }
  if (!detailEntry || detailEntry.secid !== e.secid || detailPeriod !== p) return;
  if (!bars) { $('dBody').innerHTML = '<div class="stat">图形加载失败，返回后重试。</div>'; return; }
  var N = 60, last = bars.length - 1;
  var sl = function(a) { return a.slice(-N); };
  var M = macdCalc(bars.map(function(b) { return b.c; }));
  var KJ = kdjCalc(bars);
  $('dBody').innerHTML =
    '<div class="cap"><span class="lb">' + P_LABEL[p] + '</span>' + bars[Math.max(0, last - N + 1)].d + ' ~ ' + bars[last].d + '</div>' +
    '<div class="chartbox">' + chartCandles(bars.slice(-N), 200) + '</div>' +
    '<div class="cap" style="margin-top:12px"><span class="lb">MACD</span>(12, 26, 9): MACD:<b>' + fv(M.bar[last]) + '</b> DIFF:<b>' + fv(M.dif[last]) + '</b> <span style="color:#2f4fd0">DEA:<b>' + fv(M.dea[last]) + '</b></span></div>' +
    '<div class="chartbox">' + chartMACD(sl(M.dif), sl(M.dea), sl(M.bar), 120) + '</div>' +
    '<div class="cap" style="margin-top:12px"><span class="lb">KDJ</span>(9, 3, 3): <span style="color:#f08c1a">K:<b>' + fv(KJ.K[last]) + '</b></span> <span style="color:#d6336c">D:<b>' + fv(KJ.D[last]) + '</b></span> J:<b>' + fv(KJ.J[last]) + '</b></div>' +
    '<div class="chartbox">' + chartLines([{ vals: sl(KJ.K), color: '#f08c1a' }, { vals: sl(KJ.D), color: '#d6336c' }, { vals: sl(KJ.J), color: '#1a1a1a' }], 120) + '</div>';
}

/* ---------- 启动 ---------- */
fetch('./macd-cross.json?t=' + Date.now()).then(function(r) { return r.json(); }).then(function(j) {
  DATA = j;
  $('dateBadge').textContent = '名单日期 ' + (j.date || '—');
  $('dateBadge').classList.remove('load');
  $('subInfo').textContent = '名单日期 ' + (j.date || '—') + ' · 只含 ETF · 生成于 ' + (j.generated_at || '—') + ' · 工作日收盘后更新';
  renderBoard();
  loadQuotes();
}).catch(function() {
  $('subInfo').textContent = '名单加载失败，请稍后刷新重试。';
  $('boardCols').innerHTML = '<div class="stat">加载失败</div>';
});
</script>
