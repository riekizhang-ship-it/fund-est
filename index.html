<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>指数基金实时估算榜</title>
<style>
  .navline { padding: 0 0 4px; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
         background: #141414; color: #e8e8e8; font-size: 15px; padding-bottom: 48px; }
  header { background: #1c1c1e; padding: 14px 16px 10px; position: sticky; top: 0; z-index: 10;
           border-bottom: 1px solid #2c2c2e; }
  header h1 { font-size: 17px; font-weight: 600; }
  header .sub { font-size: 12px; color: #8e8e93; margin-top: 4px; }
  header .sub b { color: #c7c7cc; font-weight: 500; }
  .live { display: inline-block; font-size: 11px; background: #1f3a24; color: #2fbf71; border-radius: 6px;
          padding: 2px 8px; margin-left: 8px; vertical-align: 2px; }
  .live.off { background: #2c2c2e; color: #8e8e93; }
  .searchbar { display: flex; gap: 8px; margin: 10px 10px 0; }
  .searchbar input { flex: 1; background: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 10px;
                     padding: 10px 12px; color: #e8e8e8; font-size: 14px; outline: none; }
  .searchbar input::placeholder { color: #636366; }
  .seg { display: flex; gap: 6px; }
  .seg button { background: #2c2c2e; color: #c7c7cc; border-radius: 9px; padding: 0 12px; font-size: 13px;
                border: none; font-weight: 600; cursor: pointer; }
  .seg button.on { background: #0a84ff; color: #fff; }
  .fund { background: #1c1c1e; margin: 8px 10px 0; border-radius: 12px; padding: 11px 14px; }
  .fund .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .fund .name { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .fund .pct { font-size: 20px; font-weight: 700; white-space: nowrap; }
  .fund .meta { display: flex; justify-content: space-between; margin-top: 7px; font-size: 12px; color: #8e8e93; gap: 8px; }
  .idx { color: #9db8d2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .up { color: #ff4d4f; } .down { color: #2fbf71; } .flat { color: #8e8e93; }
  .err { color: #ff6b6b; font-size: 13px; padding: 16px 14px; text-align: center; }
  .hintrow { color: #636366; font-size: 12px; text-align: center; padding: 12px 0 2px; }
  .controls { padding: 10px 12px 0; display: flex; gap: 10px; }
  .btn-ghost { background: #2c2c2e; color: #e8e8e8; flex: 1; border: none; border-radius: 10px; padding: 11px 0; font-size: 15px; font-weight: 600; cursor: pointer; }
  .foot { text-align: center; font-size: 11px; color: #636366; margin-top: 18px; line-height: 1.8; padding: 0 20px; }
  #toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: #2c2c2e;
           color: #fff; padding: 9px 18px; border-radius: 20px; font-size: 13px; display: none; z-index: 99; }
</style>
</head>
<body>
<header>
  <div class="navline"><a href="rank.html">切换到 · 全市场涨跌榜（2万只） →</a></div>
  <h1>指数基金实时估算榜<span class="live off" id="liveBadge">加载中…</span></h1>
  <div class="sub" id="hdrSub">跟踪指数实时涨跌推算 · 行情加载中…</div>
</header>

<div class="searchbar">
  <input id="q" type="search" placeholder="搜基金名 / 代码 / 指数，如：银行、沪深300">
  <div class="seg">
    <button id="sortDesc" class="on">估算↓</button>
    <button id="sortAsc">估算↑</button>
  </div>
</div>
<div id="list"></div>
<div class="controls" id="moreWrap" style="display:none">
  <button class="btn-ghost" id="btnMore">加载更多</button>
</div>
<div class="hintrow" id="stat"></div>
<div class="foot">估算口径：跟踪指数实时涨跌（平台通用口径）<br>
估算 ≠ 最终净值：联接基金约90-95%仓位跟踪指数，存在跟踪偏离<br>
纳斯达克100等为上个交易日收盘涨跌（美股未开盘口径）<br>
打开即加载实时行情，盘中每 30 秒自动刷新<br>
仅覆盖已验证指数映射的指数型/ETF联接基金；主动基金不在此榜</div>
<div id="toast"></div>

<script>
/* [code, name, secid, 昨日官方涨跌, 净值] */
const FUNDS = [["000008", "嘉实中证500ETF联接A", "1.000905", 0.42, "2.0245"], ["000051", "华夏沪深300ETF联接A", "1.000300", 0.13, "1.6076"], ["000071", "华夏恒生ETF联接A", "100.HSI", -0.02, "1.4247"], ["000834", "大成纳斯达克100ETF联接(QDII)A", "tencent:usNDX", -2.52, "6.1593"], ["001051", "华夏上证50ETF联接A", "1.000016", 0.3, "1.0368"], ["001344", "易方达医药ETF联接A", "1.000933", 0.88, "0.9183"], ["001592", "天弘创业板ETF联接A", "0.399006", -0.89, "1.1322"], ["001594", "天弘中证银行ETF联接A", "0.399986", 1.46, "1.9101"], ["001631", "天弘中证食品饮料ETF联接A", "2.930653"], ["003017", "广发中证军工ETF联接A", "0.399967", 1.22, "1.0593"], ["004752", "广发中证传媒ETF联接A", "0.399971", 0.42, "0.7947"], ["004854", "广发中证全指汽车指数A", "2.931008"], ["005554", "南方恒生国企ETF联接A", "100.HSCEI"], ["006098", "华宝券商ETF联接A", "0.399975", 0.21, "1.45"], ["006486", "广发中证1000ETF联接A", "1.000852", 0.3, "1.4151"], ["007466", "华泰柏瑞中证红利低波ETF联接A", "2.H30269"], ["007856", "易方达中证800ETF联接A", "1.000906", 0.21, "1.5263"], ["008020", "华富中证人工智能产业ETF联接A", "2.930713"], ["008279", "国泰中证煤炭ETF联接A", "0.399998", 0.86, "2.3884"], ["008887", "华夏国证半导体芯片ETF联接A", "0.980017", -2.22, "1.5825"], ["010955", "天弘中证智能汽车指数发起式A", "2.930721"], ["011612", "华夏科创50ETF联接A", "1.000688", -2.06, "1.0766"], ["011966", "招商中证光伏产业ETF联接A", "2.931151"], ["012348", "天弘恒生科技ETF联接A", "124.HSTECH", -0.02, "0.5595"], ["012643", "招商中证红利ETF联接A", "1.000922", 0.72, "1.1605"], ["012698", "平安中证新能车ETF联接A", "0.399976", -0.28, "0.6447"], ["012724", "国泰中证畜牧养殖ETF联接A", "2.930707"], ["012728", "国泰中证动漫游戏ETF联接A", "2.930901"], ["013125", "华夏食品饮料ETF联接A", "1.000815"], ["017641", "摩根标普500指数(QDII)人民币A", "100.SPX", -1.12, "1.6897"], ["018300", "华夏消费电子ETF联接A", "1.000932", 0.08, "1.5684"], ["018482", "鹏华创业板50ETF联接A", "0.399673", -1.09, "1.4184"], ["019666", "易方达中证创新药产业ETF联接发起式A", "2.931152"], ["020291", "华夏科创100ETF联接A", "1.000698", -0.16, "1.728"], ["020628", "汇添富科创芯片ETF联接A", "1.000685"], ["020839", "南方中证半导体产业指数发起A", "2.931865"], ["021140", "易方达汽车零部件ETF联接A", "2.931230"], ["022097", "长城中证红利低波100ETF联接A", "2.930955"], ["023148", "兴业上证180ETF联接A", "1.000010", 0.12, "1.0983"], ["023828", "万家中证半导体材料设备主题ETF发起式联接A", "2.931743"], ["024142", "南方深证100ETF联接A", "0.399330", -0.11, "1.1331"], ["024702", "嘉实中证港股通汽车产业主题指数发起式A", "2.931239"], ["161037", "富国中证高端制造指数增强型(LOF)A", "2.930820"], ["161725", "招商中证白酒指数(LOF)A", "0.399997", 0.82, "0.5441"], ["162412", "华宝医疗ETF联接A", "0.399989", 1.17, "0.5702"]];
/* secid → 指数官方名称（浏览器实测回验） */
const IDX = {
  '1.000300': '沪深300',
  '1.000905': '中证500',
  '1.000852': '中证1000',
  '1.000016': '上证50',
  '1.000906': '中证800',
  '1.000010': '上证180',
  '0.399330': '深证100',
  '0.399006': '创业板指',
  '0.399673': '创业板50',
  '1.000688': '科创50',
  '1.000698': '科创100',
  '0.399986': '中证银行',
  '0.399997': '中证白酒',
  '0.399998': '中证煤炭',
  '0.399989': '中证医疗',
  '1.000933': '中证医药',
  '0.399967': '中证军工',
  '0.399971': '中证传媒',
  '0.399975': '证券公司',
  '1.000932': '中证消费',
  '0.399976': '中证新能源汽车',
  '0.980017': '国证芯片',
  '1.000922': '中证红利',
  '100.HSI': '恒生指数',
  '124.HSTECH': '恒生科技指数',
  '100.SPX': '标普500',
  '2.931230': '中证汽车零部件',
  '2.930721': '中证智能汽车',
  '2.931008': '中证全指汽车',
  '2.931239': '中证港股通汽车',
  '2.930820': '中证高端制造',
  '2.931865': '中证半导体产业',
  '2.930713': '中证人工智能',
  '2.931151': '中证光伏产业',
  '2.931152': '中证创新药产业',
  '2.930901': '中证动漫游戏',
  '2.930707': '中证畜牧养殖',
  '2.930955': '中证红利低波动100',
  '2.H30269': '中证红利低波动',
  '1.000815': '中证细分食品饮料',
  '2.930653': '中证食品饮料',
  '1.000685': '上证科创板芯片',
  '2.931743': '中证半导体材料设备',
  '100.HSCEI': '恒生国企指数'
};
const HOSTS = ['https://push2.eastmoney.com', 'https://push2delay.eastmoney.com'];
const SECIDS = Object.keys(IDX);
/* 腾讯通道的指数（名称 → 展示名） */
const TENCENT_NAME = { 'tencent:usNDX': '纳斯达克100' };
function idxName(s) { return IDX[s] || TENCENT_NAME[s] || '指数'; }

let EST = {};        // secid → 估算涨跌
let view = [], shown = 0, sortDir = -1, liveOK = false, trading = false;
const PAGE = 100;

function cls(v) { return v > 0 ? 'up' : (v < 0 ? 'down' : 'flat'); }
function fmt(v) { return (v > 0 ? '+' : '') + v.toFixed(2) + '%'; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2000); }
function inTradingHours() {
  const d = new Date(), day = d.getDay();
  if (day === 0 || day === 6) return false;
  const m = d.getHours() * 60 + d.getMinutes();
  return m >= 540 && m <= 930;
}

function estOf(secid) { return EST.hasOwnProperty(secid) ? EST[secid] : null; }

function applyFilter() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  view = FUNDS.filter(f => {
    const e = estOf(f[2]);
    if (!q) return true;
    return f[1].toLowerCase().indexOf(q) > -1 || f[0].indexOf(q) > -1 || idxName(f[2]).toLowerCase().indexOf(q) > -1;
  });
  view.sort((a, b) => {
    const va = estOf(a[2]), vb = estOf(b[2]);
    if (va === null && vb === null) return 0;
    if (va === null) return 1; if (vb === null) return -1;
    return sortDir === -1 ? vb - va : va - vb;
  });
  shown = 0;
  document.getElementById('list').innerHTML = '';
  renderMore();
}

function renderMore() {
  const list = document.getElementById('list');
  const end = Math.min(shown + PAGE, view.length);
  let html = '';
  for (let i = shown; i < end; i++) {
    const f = view[i], e = estOf(f[2]);
    const pctTxt = f[3] === null ? '—' : fmt(f[3]);
    html += '<div class="fund"><div class="top"><div class="name">' + esc(f[1]) + '</div>' +
      '<div class="pct ' + (e === null ? 'flat' : cls(e)) + '">' + (e === null ? '—' : fmt(e)) + '</div></div>' +
      '<div class="meta"><span class="idx">' + f[0] + ' · 跟踪' + esc(idxName(f[2])) + '</span>' +
      '<span>昨日 ' + pctTxt + ' · 净值 ' + f[4] + '</span></div></div>';
  }
  list.insertAdjacentHTML('beforeend', html);
  shown = end;
  document.getElementById('moreWrap').style.display = shown < view.length ? 'flex' : 'none';
  const q = document.getElementById('q').value.trim();
  document.getElementById('stat').textContent =
    (q ? '匹配 ' + view.length.toLocaleString() + ' 只 · ' : '') +
    '已显示 ' + shown.toLocaleString() + ' / ' + view.length.toLocaleString() + ' 只';
}

function setBadge() {
  const b = document.getElementById('liveBadge');
  if (liveOK && trading) { b.textContent = '盘中实时'; b.className = 'live'; }
  else if (liveOK) { b.textContent = '收盘估算'; b.className = 'live off'; }
  else { b.textContent = '加载中…'; b.className = 'live off'; }
}

/* 腾讯通道：纳斯达克100（script 标签，无跨域问题；GBK 编码） */
async function loadTencent() {
  const val = await new Promise(resolve => {
    const s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); resolve(null); }, 10000);
    function cleanup() { clearTimeout(timer); try { s.remove(); } catch (e) {} }
    s.charset = 'gbk';
    s.onload = () => {
      let v = null;
      try {
        const txt = window['v_usNDX'] || '';
        const m = txt.match(/~\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}~[^~]*~(-?\d+\.?\d*)~/);
        if (m) v = parseFloat(m[1]);
      } catch (e) {}
      cleanup(); resolve(v);
    };
    s.onerror = () => { cleanup(); resolve(null); };
    s.src = 'https://qt.gtimg.cn/q=usNDX&_=' + Date.now();
    document.body.appendChild(s);
  });
  if (val !== null && !isNaN(val)) EST['tencent:usNDX'] = val;
}

async function loadQuotes() {
  const url = p => p + '/api/qt/ulist.np/get?fltt=2&invt=2&fields=f12,f13,f14,f3&secids=' + SECIDS.join(',');
  let data = null;
  for (const h of HOSTS) {
    try {
      const res = await fetch(url(h), { cache: 'no-store' });
      if (!res.ok) continue;
      const j = await res.json();
      if (j && j.rc === 0 && j.data && j.data.diff) { data = j.data.diff; break; }
    } catch (e) { /* 换下一个 host */ }
  }
  if (!data) {
    /* JSONP 兜底 */
    data = await new Promise(resolve => {
      const cb = '__estcb' + Date.now();
      const timer = setTimeout(() => { cleanup(); resolve(null); }, 10000);
      function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
      window[cb] = j => { cleanup(); resolve((j && j.rc === 0 && j.data && j.data.diff) || null); };
      const s = document.createElement('script');
      s.src = url(HOSTS[0]) + '&cb=' + cb;
      s.onerror = () => { cleanup(); resolve(null); };
      document.body.appendChild(s);
    });
  }
  if (data) {
    EST = {};
    data.forEach(d => { EST[d.f13 + '.' + d.f12] = d.f3; });
    liveOK = true;
  }
  /* 腾讯通道合并（不影响 push2 的状态判定） */
  try { await loadTencent(); } catch (e) {}
  if (liveOK) {
    setBadge();
    document.getElementById('hdrSub').innerHTML =
      '跟踪指数实时涨跌推算 · 一个指数一只代表基金 · 共 <b>' + Object.keys(EST).length + '</b> 个指数' +
      ' · 更新 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
    applyFilter();
  } else {
    /* 实时行情加载失败：不显示任何估算，提示刷新 */
    document.getElementById('liveBadge').textContent = '行情未连接';
    document.getElementById('hdrSub').innerHTML =
      '实时行情加载失败，请刷新页面重试 · 共 <b>' + SECIDS.length + '</b> 个指数';
    toast('实时行情加载失败，请刷新页面重试');
    applyFilter();
  }
}

document.getElementById('q').addEventListener('input', () => applyFilter());
document.getElementById('btnMore').onclick = renderMore;
document.getElementById('sortDesc').onclick = function () { sortDir = -1; this.classList.add('on'); document.getElementById('sortAsc').classList.remove('on'); applyFilter(); };
document.getElementById('sortAsc').onclick = function () { sortDir = 1; this.classList.add('on'); document.getElementById('sortDesc').classList.remove('on'); applyFilter(); };
document.getElementById('btnRefresh') && (document.getElementById('btnRefresh').onclick = loadQuotes);

trading = inTradingHours();
setBadge();
document.getElementById('hdrSub').innerHTML =
  '跟踪指数实时涨跌推算 · 一个指数一只代表基金 · 共 <b>' + SECIDS.length + '</b> 个指数 · 行情加载中…';
applyFilter();
loadQuotes();
setInterval(() => { if (inTradingHours()) loadQuotes(); }, 30000);
</script>
</body>
</html>
